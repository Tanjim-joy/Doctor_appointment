services:
  db:
    image: mysql:8.0
    container_name: docapp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doc_appointments
      MYSQL_USER: appuser
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-psecret"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 80s
    networks:
      - app-network

  backend:
    build:
      context: ./doc_appoinmt
      dockerfile: Dockerfile
    container_name: docapp_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: appuser
      DB_PASSWORD: secret
      DB_NAME: doc_appointments
      GIN_MODE: release
    networks:
      - app-network

  frontend:
    build:
      context: ./doc-appointment-frontend
      dockerfile: Dockerfile
    container_name: docapp_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
